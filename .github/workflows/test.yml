name: Test

on: [push, pull_request]

# 编排（Agent）已迁到 Node 运行时，Python 只保留可选的**预标注推理**环境，
# 且需用户自备 conda 解释器（嵌入式 Python 运行时已移除）。
# 因此这里不再有「下载嵌入式运行时 + 建 venv + pip 装 torch 跑冒烟」的重型 job，
# 推理侧改由 inference-lite 做零依赖的清单/契约校验。
#
# job 刻意拆开且互不依赖：原先 lint 失败会把 typecheck / test 一并 skip，
# 一次只能拿到三分之一信号。
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      - name: npm run lint
        run: npm run lint

  typecheck:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      - name: Typecheck
        run: npm exec tsc

  test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      # jest 的 setupFiles 里有 .erb/scripts/check-build-exists.ts，会断言
      # dist/main/main.js 与 dist/renderer/renderer.js 存在，故必须先构建。
      # 这里只需 npm run build（不跑 electron-builder），比 package 便宜得多。
      - name: Build bundles required by jest
        run: npm run build

      - name: npm test
        run: npm test -- --ci

  # Agent 运行时的协议契约测试：起 mock LLM server 校验 SSE chunk 序列与
  # tool_call 分片重组。零外部依赖（scenarios.mjs 无 import），故不装 node_modules。
  baseline-selftest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm run baseline:selftest
        run: npm run baseline:selftest

  # 预标注推理仍是发布产物（见 package.json 的 extraResources），但它依赖的
  # 嵌入式运行时已移除，无法再在 CI 里建环境冒烟。这里只做零依赖的静态校验：
  # 依赖清单与 envInstaller.ts 常量是否同步、打包清单是否仍含推理服务等。
  inference-lite:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 语法检查 vendor/inference
        run: python -m compileall -q vendor/inference

      - name: 依赖清单与安装器常量一致性
        run: node scripts/ciCheckInferenceManifests.mjs

  package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm install

      - name: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package
